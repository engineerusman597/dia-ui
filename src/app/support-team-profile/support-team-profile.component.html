<section class="professional-page">
  <div class="page-header">
    <div class="header-content">
      <div class="header-icon-wrapper">
        <mat-icon class="header-icon">person</mat-icon>
      </div>
      <div class="header-text">
        <h1 class="page-title">
          Support Team Profile
        </h1>
        <p class="page-subtitle">
          View and manage your profile information, including personal details and account settings.
        </p>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" matButton="filled" class="primary btn" (click)="changePassword()">
        <mat-icon class="medium-icon fs-5 align-middle">lock_reset</mat-icon>
        <span>Change Password</span>
      </button>
      <button type="button" matButton="filled" class="error btn" [routerLink]="['/support/upload-document', user?.id]"
        [disabled]="!user">
        <mat-icon class="medium-icon fs-5 align-middle">arrow_back</mat-icon>
        <span>Back</span>
      </button>
    </div>
  </div>
  <mat-card appearance="outlined">
    <mat-card-content>
      <div class="row">
        <div class="profile-grid">
          <div class="form-group">
            <label class="form-label text-danger">First Name <sup>*</sup></label>
            <input class="form-control" type="text" [value]="user?.firstName || ''" readonly>
          </div>

          <div class="form-group">
            <label class="form-label text-danger">Last Name <sup>*</sup></label>
            <input class="form-control" type="text" [value]="user?.lastName || ''" readonly>
          </div>

          <div class="form-group">
            <label class="form-label text-danger">Mobile Number <sup>*</sup></label>
            <input class="form-control" type="text" [value]="user?.phoneNumber || ''" readonly>
          </div>

          <div class="form-group">
            <label class="form-label text-danger">Email <sup>*</sup></label>
            <input class="form-control" type="text" [value]="user?.email || ''" readonly>
          </div>
        </div>

        <div class="mt-4">
          <button type="button" matButton="filled" class="error btn" [routerLink]="['/support/upload-document', user?.id]"
            [disabled]="!user">
            <mat-icon class="medium-icon fs-5 align-middle">arrow_back</mat-icon>
            <span>Back</span>
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</section>
