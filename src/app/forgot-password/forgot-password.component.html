<div class="forgot-password-page container text-center">
    <div class="kyc-header pt-4">
        <img src="assets/images/DI-Logo.png" alt="DIASPORA INSURANCE" class="logo" />
        <h1><span class="kyc">KYC</span> Compliance Portal</h1>
        <p class="lead-text">Please enter your email to reset your password.</p>
    </div>

    <div class="card password-card mx-auto mt-4">
        <div class="card-body text-center">
            <h2 class="card-title" style="font-weight: 200;">FORGOT PASSWORD</h2>
            <p class="small-muted mb-3">We will send you a link to reset your password.</p>

            <form [formGroup]="form" (ngSubmit)="submit()" class="w-100 d-flex flex-column align-items-center">
                <div class="w-75">
                    <input type="email" formControlName="email" placeholder="Email"
                        class="form-control form-control-lg"
                        [class.is-invalid]="form.get('email')?.touched && form.get('email')?.invalid">
                    <div class="invalid-feedback text-start"
                        *ngIf="form.get('email')?.touched && form.get('email')?.hasError('required')">Email is required</div>
                    <div class="invalid-feedback text-start"
                        *ngIf="form.get('email')?.touched && form.get('email')?.hasError('email')">Invalid email address</div>
                </div>

                <button type="submit" class="btn mt-3"
                    style="font-weight: 500; background: #D4AF37; color: #0a0a0a; padding: 8px 56px !important;"
                    [disabled]="submitting">{{ submitting ?
                    'Submitting...' : 'Send Reset Link' }}</button>
            </form>
        </div>
    </div>
</div>
