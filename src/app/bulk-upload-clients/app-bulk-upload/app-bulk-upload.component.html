<div class="upload-area">
  <input type="file" accept=".csv, .xlsx" hidden #fileInput (change)="onFileSelected($event)" />

  @if (!selectedFile) {
  <div class="drop-zone" (click)="fileInput.click()">
    <mat-icon class="upload-icon">cloud_upload</mat-icon>
    <p class="drop-text">Click to select a CSV Or Excel file</p>
    <p class="drop-hint">Only .csv and .xlsx files are accepted</p>
  </div>
  }

  @if (selectedFile) {
  <div class="file-info">
    <div class="file-details">
      <mat-icon>description</mat-icon>
      <div>
        <span class="file-name">{{ selectedFile.name }}</span>
        <span class="file-size">{{ (selectedFile.size / 1024).toFixed(1) }} KB</span>
      </div>
    </div>
    <div class="file-actions">
      <button mat-icon-button color="warn" (click)="removeFile()" [disabled]="uploading">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  @if (uploading) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  <button mat-raised-button color="primary" (click)="upload()" [disabled]="uploading" class="upload-btn">
    <mat-icon>upload</mat-icon>
    {{ uploading ? 'Uploading...' : 'Upload' }}
  </button>
  }
</div>
