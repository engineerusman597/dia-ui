<h2 mat-dialog-title>File Entries - {{ data.fileName }}</h2>
<mat-dialog-content>
  @if (isLoading) {
  <div class="d-flex justify-content-center p-3">
    <mat-progress-spinner mode="indeterminate" diameter="40" strokeWidth="4"></mat-progress-spinner>
  </div>
  }

  @if (!isLoading && entries.length > 0) {
  <div class="grid-height-medium">
    <table mat-table [dataSource]="entries">
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let row">{{ row.email }}</td>
      </ng-container>

      <ng-container matColumnDef="policyNumber">
        <th mat-header-cell *matHeaderCellDef>Policy Number</th>
        <td mat-cell *matCellDef="let row">{{ row.policyNumber }}</td>
      </ng-container>

      <ng-container matColumnDef="errorMessage">
        <th mat-header-cell *matHeaderCellDef>Error Message</th>
        <td mat-cell *matCellDef="let row">
          <span class="text-danger">{{ row.errorMessage }}</span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      <tr *matNoDataRow>
        <td colspan="3">
          <div class="m-2"><b>No records found.</b></div>
        </td>
      </tr>
    </table>
  </div>
  }

  @if (!isLoading && entries.length === 0) {
  <div class="p-3 text-center text-muted">
    No entries found for this file.
  </div>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton="filled" class="error btn"  mat-dialog-close>Close</button>
</mat-dialog-actions>
