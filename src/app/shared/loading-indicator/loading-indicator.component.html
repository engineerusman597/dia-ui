<div *ngIf="isSpinnerVisible" class="fullscreen-loader-overlay">
  <div class="fullscreen-loader-content">
    <span class="spinner-ring" role="status" aria-hidden="true" style="width: 4rem; height: 4rem;"></span>
    <div class="text-dark fs-6" style="margin-top: 6rem;">Please wait...</div>
  </div>
</div>
