<div class="pdf-wrapper">
  @if(src) {
  <!-- PDF Toolbar -->
  <div class="pdf-toolbar">
    <button class="btn" matTooltip="Rotate Left" (click)="rotateCcw()">
      <mat-icon class="medium-icon fs-4 align-middle">rotate_left</mat-icon>
    </button>
    <button class="btn" matTooltip="Rotate Right" (click)="rotateCw()">
      <mat-icon class="medium-icon fs-4 align-middle">rotate_right</mat-icon>
    </button>
  </div>
  <!-- PDF Viewer -->
  <div class="pdf-container" [style.height]="height">
    <pdf-viewer [src]="src" [rotation]="rotation" [render-text]="true" [original-size]="false" [show-all]="true"
      [autoresize]="true" [show-borders]="true" style="display:block; width:100%; height:100%;">
    </pdf-viewer>
  </div>
  } @else {
  <div class="no-src">No document to display</div>
  }
</div>
